<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Black Mentoring — Mentoring Day</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root {
  --bg:   #050505;
  --gold: #DC9F42;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  width: 1920px;
  height: 1080px;
  overflow: hidden;
}

[data-composition-id="bm-logo-slide"] {
  position: relative;
  width: 1920px;
  height: 1080px;
  background: var(--bg);
  overflow: hidden;
}

.bg-glow {
  position: absolute;
  top: 60px;
  left: 480px;
  width: 960px;
  height: 960px;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(220,159,66,0.14) 0%,
    rgba(220,159,66,0.05) 40%,
    transparent 70%);
  pointer-events: none;
}

.logo-glow {
  position: absolute;
  top: 240px;
  left: 650px;
  width: 620px;
  height: 600px;
  border-radius: 50%;
  background: radial-gradient(ellipse,
    rgba(220,159,66,0.30) 0%,
    rgba(220,159,66,0.10) 40%,
    transparent 70%);
  pointer-events: none;
}

.rule-h {
  position: absolute;
  left: 680px;
  height: 1px;
  width: 560px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(220,159,66,0.55) 25%,
    rgba(220,159,66,0.55) 75%,
    transparent 100%);
  transform-origin: center;
}
.rule-top    { top: 190px; }
.rule-bottom { top: 890px; }

.corner { position: absolute; width: 48px; height: 48px; }
.corner::before,
.corner::after {
  content: '';
  position: absolute;
  background: rgba(220,159,66,0.50);
}
.corner::before { width: 100%; height: 1px; top: 0; left: 0; }
.corner::after  { width: 1px; height: 100%; top: 0; left: 0; }

.corner-tl { top: 108px; left: 148px; }
.corner-tr { top: 108px; right: 148px; transform: scaleX(-1); }
.corner-bl { bottom: 108px; left: 148px; transform: scaleY(-1); }
.corner-br { bottom: 108px; right: 148px; transform: scale(-1,-1); }

.logo-wrap {
  position: absolute;
  top: 265px;
  left: 700px;
  width: 520px;
  height: 550px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: invert(1);
  mix-blend-mode: screen;
}
</style>
</head>

  <script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // ── BUILD (0–3s) ─────────────────────────────────────────────

  tl.fromTo("#bg-glow",
    { opacity: 0 },
    { opacity: 1, duration: 2.4, ease: "sine.inOut" },
    0.2
  );

  tl.fromTo(["#c-tl","#c-tr","#c-bl","#c-br"],
    { opacity: 0 },
    { opacity: 1, duration: 0.6, ease: "power2.out", stagger: 0.1 },
    0.5
  );

  tl.fromTo("#rule-top",
    { scaleX: 0, opacity: 0 },
    { scaleX: 1, opacity: 1, duration: 1.0, ease: "expo.out" },
    0.9
  );
  tl.fromTo("#rule-bottom",
    { scaleX: 0, opacity: 0 },
    { scaleX: 1, opacity: 1, duration: 1.0, ease: "expo.out" },
    1.1
  );

  tl.fromTo("#logo-img",
    { opacity: 0, scale: 0.80 },
    { opacity: 1, scale: 1, duration: 1.6, ease: "expo.out" },
    1.2
  );

  tl.fromTo("#logo-glow",
    { opacity: 0, scale: 0.70 },
    { opacity: 1, scale: 1, duration: 1.2, ease: "power3.out" },
    1.8
  );

  // ── BREATHE (3s–30s = 27s) ───────────────────────────────────

  // logo-glow: 1.5s × 18 half-cycles (repeat:17, yoyo) = 27s
  tl.to("#logo-glow",
    { opacity: 0.45, scale: 1.12, duration: 1.5, ease: "sine.inOut", repeat: 17, yoyo: true },
    3.0
  );

  // bg-glow: 3s × 9 half-cycles (repeat:8, yoyo) = 27s
  tl.to("#bg-glow",
    { opacity: 0.70, scale: 1.06, duration: 3, ease: "sine.inOut", repeat: 8, yoyo: true },
    3.0
  );

  // logo: 4.5s × 6 half-cycles (repeat:5, yoyo) = 27s
  tl.to("#logo-img",
    { scale: 1.025, duration: 4.5, ease: "sine.inOut", repeat: 5, yoyo: true },
    3.0
  );

  window.__timelines["bm-logo-slide"] = tl;

  tl.play();
