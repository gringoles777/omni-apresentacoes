name: Atualizar Relatório de Leads — Tentativa de Conectar

on:
  schedule:
    # 18:50 UTC = 16:50 Brasília, segunda a sexta
    - cron: "50 18 * * 1-5"
  workflow_dispatch:
    # Permite rodar manualmente pelo GitHub Actions

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rodar script de atualização
        env:
          PIPEDRIVE_API_KEY: ${{ secrets.PIPEDRIVE_API_KEY }}
          CHATWOOT_TOKEN: ${{ secrets.CHATWOOT_TOKEN }}
        run: python scripts/update-leads-report.py

      - name: Commit e push se houver mudanças
        run: |
          git config user.name "AURA Bot"
          git config user.email "aura-bot@omnihypnosis.com.br"
          git add leads-responderam-tentativa-conectar.html
          git diff --staged --quiet || git commit -m "chore(auto): atualiza relatório de leads $(date +'%d/%m/%Y %H:%M BRT')"
          git push
