<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050505">
<title>O Talento Que as Pessoas Veem em Você — OMNI Brasil</title>
<style>
  /* ── Design System OMNI · Dark Gold · self-contained (zero CDN) ────────────
     Fontes: system serif (Georgia) nas perguntas + system sans nos rótulos.
     Sem @import/CDN (trava de performance FCP<1s, webview do Instagram). */
  :root{
    color-scheme:dark;
    --black:#050505; --panel:#0D0D0D; --panel2:#141210;
    --ink:#F5F0E8; --muted:#c9bfa9; --dim:#6B6B6B;
    --gold:#C8A84B; --gold-light:#E8C86A; --gold-deep:#9A7A2E;
    --gold-grad:linear-gradient(135deg,#9A7A2E 0%,#C8A84B 40%,#E8C86A 60%,#C8A84B 80%,#9A7A2E 100%);
    --line:rgba(200,168,75,.15);
    --serif:'Cormorant Garamond','Georgia','Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1100px 700px at 50% -8%,#12100b 0%,var(--black) 58%);
    color:var(--ink);font-family:var(--serif);line-height:1.5;
    min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* faíscas de fundo (CSS puro) */
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5}
  .stars i{position:absolute;width:3px;height:3px;border-radius:50%;
    background:var(--gold-light);box-shadow:0 0 6px 1px rgba(232,200,106,.6);
    animation:tw 3.4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.9;transform:scale(1.15)}}

  header.topo{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
    padding:13px 18px;background:rgba(5,5,5,.86);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .marca{font-family:var(--sans);font-weight:700;font-size:13px;letter-spacing:.32em;color:var(--gold)}
  .inf{font-size:19px;color:var(--gold);opacity:.85}

  .progress{position:sticky;top:47px;z-index:4;height:3px;background:rgba(255,255,255,.05)}
  .progress .fill{height:100%;width:0;background:var(--gold-grad);
    transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .chaprot{position:sticky;top:50px;z-index:4;text-align:right;padding:6px 18px 0;
    font-family:var(--sans);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);
    background:linear-gradient(180deg,rgba(5,5,5,.86),transparent);min-height:18px}

  main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:8px 20px 60px}
  .screen{animation:enter .42s cubic-bezier(.2,.8,.2,1)}
  @keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin:10px 0 2px}
  h1{font-family:var(--serif);font-weight:600;line-height:1.16;margin:6px 0 12px;
    font-size:clamp(1.9rem,7vw,2.6rem)}
  .q{font-family:var(--serif);font-weight:600;line-height:1.28;
    font-size:clamp(1.35rem,5.4vw,1.65rem);margin:6px 0 20px}
  .lead{color:var(--muted);font-family:var(--sans);font-size:15.5px;line-height:1.65;margin:0 0 14px}
  .cenario{border:1px solid rgba(200,168,75,.28);border-radius:8px;padding:14px 16px;margin:2px 0 16px;
    background:rgba(200,168,75,.05);font-style:italic;color:var(--ink);font-size:1.08rem}

  /* cartões de opção */
  .opts{display:flex;flex-direction:column;gap:10px;margin:4px 0 8px}
  .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
    min-height:64px;padding:14px 16px;border-radius:4px;border:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01));
    color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.4;
    transition:border-color .18s,background .18s,opacity .34s,transform .12s;
    animation:optin .42s both}
  @keyframes optin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .opt .key{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    font-weight:700;font-size:14px;color:var(--gold);border:1px solid rgba(200,168,75,.4);
    transition:all .3s}
  .opt:hover{border-color:rgba(200,168,75,.5)}
  .opt:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(200,168,75,.45)}
  .opt.sel{border-color:var(--gold);background:linear-gradient(180deg,rgba(200,168,75,.14),rgba(200,168,75,.04))}
  .opt.sel .key{background:var(--gold-grad);color:#1a1405;border-color:transparent;transform:scale(1.08)}
  .opt.dim{opacity:.32}

  .back{display:inline-block;margin-top:14px;background:none;border:0;color:var(--dim);
    font-family:var(--sans);font-size:13px;cursor:pointer;padding:6px 2px}
  .back:hover{color:var(--muted)}
  .whisper{margin-top:10px;color:var(--dim);font-family:var(--sans);font-size:13px;font-style:italic;
    opacity:0;transition:opacity .6s}
  .whisper.on{opacity:1}

  /* botões */
  .btn{display:block;width:100%;padding:18px 22px;border:0;border-radius:4px;cursor:pointer;
    font-family:var(--sans);font-weight:800;font-size:16px;letter-spacing:.01em;color:#1a1405;
    background:var(--gold-grad);
    box-shadow:0 8px 26px rgba(200,168,75,.3),0 0 0 1px rgba(232,200,106,.55) inset;
    animation:breathe 3.2s ease-in-out infinite;transition:transform .14s}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(0)}
  @keyframes breathe{0%,100%{box-shadow:0 8px 26px rgba(200,168,75,.28),0 0 0 1px rgba(232,200,106,.5) inset}
    50%{box-shadow:0 10px 32px rgba(200,168,75,.44),0 0 22px rgba(232,200,106,.3),0 0 0 1px rgba(232,200,106,.7) inset}}
  .btn.ghost{background:none;color:var(--muted);border:1px solid var(--line);box-shadow:none;
    font-weight:600;animation:none;margin-top:12px}
  .btn.ghost:hover{color:var(--ink)}
  .subhint{display:block;text-align:center;margin-top:12px;color:var(--muted);font-family:var(--sans);font-size:13px}

  /* abertura */
  .micro{font-family:var(--sans);font-size:13.5px;color:var(--gold);margin:16px 0 4px;letter-spacing:.02em}
  .bullets{list-style:none;padding:0;margin:16px 0;font-family:var(--sans)}
  .bullets li{position:relative;padding:8px 0 8px 26px;color:var(--muted);font-size:14.5px;line-height:1.5}
  .bullets li::before{content:'✦';position:absolute;left:0;top:8px;color:var(--gold);font-size:13px}
  .selo-cred{margin-top:18px;font-family:var(--sans);font-size:12px;color:var(--dim);line-height:1.6}

  /* eco */
  .eco{text-align:center;padding:28px 6px}
  .spark{font-size:38px;color:var(--gold-light);text-shadow:0 0 20px rgba(232,200,106,.6);
    animation:pulse 1.5s ease-in-out 1;margin-bottom:8px}
  @keyframes pulse{0%{transform:scale(.7);opacity:.3}40%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:.95}}
  .eco .kick{font-family:var(--sans);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:14px}
  .eco .frase{font-family:var(--serif);font-style:italic;font-size:clamp(1.4rem,5.6vw,1.7rem);
    color:var(--gold-light);line-height:1.4;max-width:440px;margin:0 auto 26px}

  /* processamento */
  .proc{text-align:center;padding:70px 10px}
  .constel{font-size:44px;color:var(--gold-light);text-shadow:0 0 26px rgba(232,200,106,.7);
    animation:pulse 1.4s ease-in-out infinite}
  .proc .msg{font-family:var(--serif);font-size:1.4rem;color:var(--ink);margin-top:26px;min-height:2em}

  /* revelação / card */
  .rev-eyebrow{text-align:center}
  .card9{position:relative;margin:14px auto 20px;max-width:340px;border-radius:12px;overflow:hidden;
    border:1px solid rgba(200,168,75,.3);
    background:radial-gradient(120% 80% at 50% 0%,#161207 0%,#050505 62%);
    box-shadow:0 0 0 1px rgba(232,200,106,.15) inset,0 20px 60px rgba(0,0,0,.6);
    padding:34px 24px 26px;text-align:center;animation:glowin .8s ease both}
  @keyframes glowin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .card9 .inf-b{font-size:26px;color:var(--gold);opacity:.9}
  .card9 .cstars{font-size:13px;letter-spacing:.5em;color:var(--gold-deep);margin:6px 0 14px}
  .card9 .lbl{font-family:var(--sans);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  .card9 .arq{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,9vw,2.7rem);line-height:1.08;margin:8px 0;
    background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .card9 .ln{width:60px;height:2px;margin:8px auto;background:var(--gold-grad);border-radius:2px}
  .card9 .sig{font-family:var(--serif);font-style:italic;color:var(--ink);font-size:1.05rem;line-height:1.4;margin-top:10px}
  .card9 .foot{font-family:var(--sans);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:18px}

  .reading{font-family:var(--sans);font-size:15.5px;line-height:1.68;color:var(--ink)}
  .reading p{margin:0 0 13px;animation:enter .5s both}
  .reading .branch{border-left:2px solid var(--gold);padding:2px 0 2px 14px;color:var(--muted);font-style:italic}
  .reading .l50{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);color:var(--muted);font-style:italic}

  /* radar barras */
  .radar{margin:22px 0 6px}
  .radar .rk{font-family:var(--sans);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
  .rrow{display:flex;align-items:center;gap:12px;margin:10px 0}
  .rrow .rn{flex:0 0 132px;font-family:var(--sans);font-size:13px;color:var(--muted)}
  .rrow .rbar{flex:1;height:12px;border-radius:6px;background:rgba(255,255,255,.05);overflow:hidden}
  .rrow .rbar i{display:block;height:100%;width:0;border-radius:6px;background:var(--gold-grad);
    transition:width .7s cubic-bezier(.2,.8,.2,1)}

  /* email */
  .field{margin:16px 0 8px}
  .field label{display:block;font-family:var(--sans);font-weight:600;font-size:15px;color:var(--ink);margin-bottom:8px}
  .field input{width:100%;padding:15px 16px;font-size:16px;border-radius:4px;
    border:1px solid rgba(200,168,75,.4);background:#141210;color:var(--ink);font-family:var(--sans);
    caret-color:var(--gold-light)}
  .field input:focus{outline:none;border-color:var(--gold)}
  .lgpd{font-family:var(--sans);font-size:11.5px;color:var(--dim);line-height:1.6;margin-top:16px}
  .lgpd a{color:var(--gold)}

  /* rota / presente */
  .presente{border:1px solid var(--gold);border-radius:10px;padding:20px 18px;margin:18px 0;
    background:radial-gradient(420px 220px at 50% 0%,rgba(200,168,75,.14),rgba(200,168,75,.02) 62%),var(--panel2)}
  .presente .kk{font-family:var(--sans);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-light);margin-bottom:8px}
  .rota-body{font-family:var(--sans);font-size:15.5px;line-height:1.66;color:var(--ink)}
  .rota-body p{margin:0 0 12px}
  .agenda{list-style:none;padding:0;margin:14px 0}
  .agenda li{padding:12px 14px;border:1px solid var(--line);border-radius:4px;margin-bottom:8px;
    font-family:var(--sans);font-size:14.5px;color:var(--ink);cursor:pointer}
  .agenda li:hover{border-color:var(--gold)}

  .center{text-align:center}
  .disclaimer{font-family:var(--sans);font-size:12.5px;color:var(--dim);text-align:center;margin-top:26px;line-height:1.6}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:opacity .2s!important}
    .rrow .rbar i{transition:width .2s!important}
  }
#demo-ribbon{position:fixed;top:10px;right:-34px;z-index:99999;background:#8a6d2f;color:#fff;font-size:11px;letter-spacing:2px;padding:4px 40px;transform:rotate(35deg);opacity:.85;pointer-events:none;font-family:sans-serif}
</style>
</head>
<body><div id="demo-ribbon">RASCUNHO</div>
<div class="stars" id="stars" aria-hidden="true"></div>
<header class="topo"><span class="marca">OMNI BRASIL</span><span class="inf">∞</span></header>
<div class="progress"><div class="fill" id="pfill"></div></div>
<div class="chaprot" id="chaprot" aria-live="polite"></div>
<main id="app"></main>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   CONFIG — placeholders a preencher no go-live (ver 09-copy §13 OBRIGATÓRIO).
   ═══════════════════════════════════════════════════════════════════════════ */
var CONFIG = {
  NOME_ESPECIALISTA: "Diumara Carvalho (exemplo, a definir)",
  CREDENCIAL: "formado(a) e certificado(a) pela OMNI, com anos ajudando pessoas a fazer essa transição",
  CNPJ: "00.000.000/0001-00 (demo)",
  URL_PRIVACIDADE: "#",
  HORARIOS_AGENDA: ["Segunda, 10h30","Terça, 15h00","Quarta, 19h30"], // DEMO fictício
  WHATSAPP_LINK: "https://wa.me/5511972343492",
  TEST_URL: "omnihypnosis.com.br/mapa",
  ENDPOINT: "/intake/teste-vocacao",
  ENDPOINT_CTA: "/intake/teste-vocacao/cta"
};

/* ═══════════════════════════════════════════════════════════════════════════
   SCORING ENGINE — ESPELHO EXATO de src/vocation_scoring.js (KEEP IN SYNC!)
   Qualquer alteração de peso/regra deve ser replicada nos dois arquivos.
   ═══════════════════════════════════════════════════════════════════════════ */
var QW = {
  Q1:{sentido:[100,70,50,0]},
  Q2:{d1:[100,66,33,0]}, Q3:{d2:[100,66,15,0]}, Q4:{d1:[100,40,30,30]},
  Q5:{d2:[100,66,33,0]}, Q6:{d3:[100,66,33,0]}, Q7:{d1:[100,66,33,10]},
  Q8:{d3:[100,55,45,25]}, Q9:{d3:[100,66,33,0]}, Q10:{d3:[100,66,33,0]},
  Q11:{d2:[100,70,35,0]}, Q12:{renda:[90,80,85,25,85,75]}, Q13:{invest:[100,70,35,10]},
  Q14:{d4:[100,75,45,10]}, Q15:{d4:[100,75,55,15]}, Q16:{dispo:[100,60,30,15]},
  Q17:{d4:[100,60,70,15]}, Q12b:{idade:[25,35,45,55,62]}
};
function scoreVocation(respostas, telemetry){
  telemetry = telemetry || {};
  var r={}; for(var k in respostas){var n=parseInt(respostas[k],10); if(!isNaN(n)) r[k]=n;}
  function V(q,key){var a=QW[q]&&QW[q][key]; var i=(r[q]||0)-1; return (a&&i>=0&&i<a.length)?a[i]:0;}
  function avg(){var s=0; for(var i=0;i<arguments.length;i++)s+=arguments[i]; return s/arguments.length;}
  var round=Math.round;

  var d1_carrega=V('Q7','d1'), d3_procurado=V('Q6','d3'), d3_ja_disseram=V('Q9','d3');
  var D1=avg(V('Q2','d1'),V('Q4','d1'),V('Q7','d1'));
  var D2=avg(V('Q3','d2'),V('Q5','d2'),V('Q11','d2'));
  var d3proc=d3_procurado;
  var D3=avg(d3proc,V('Q8','d3'),d3_ja_disseram,V('Q10','d3'));
  var D4=avg(V('Q14','d4'),V('Q15','d4'),V('Q17','d4'));

  var renda_proxy=V('Q12','renda'), prontidao_invest=V('Q13','invest'), invest_dispo=V('Q16','dispo');
  var gancho_sentido=V('Q1','sentido'), idade=V('Q12b','idade');
  var fit_facilitador=(r.Q8===1)||(r.Q4===2), salvador=(r.Q8===4), fit_pragmatico=(r.Q11===4);
  var motivacao_fuga=(r.Q1===1)||(r.Q1===2)||(r.Q17===3);
  var motivacao_fuga_alta=(r.Q1===1)||(r.Q17===3);
  var flags=[];

  var flag_autodesq=false;
  if(d1_carrega>=66 && D1>=80 && D2>=80 && d3_procurado<=33 && d3_ja_disseram>=66){
    flag_autodesq=true; d3proc=Math.min(100,d3_procurado+33);
    D3=avg(d3proc,V('Q8','d3'),d3_ja_disseram,V('Q10','d3')); flags.push('autodesqualificacao');
  }

  var arquetipo=(function(){
    if(flag_autodesq) return 'Guia Silencioso';
    if(D1<=35 && D3<=35) return 'Realizador';
    if(D1>=66 && D2>=55 && D3<=65 && d3_ja_disseram>=66) return 'Guia Silencioso';
    if(D1>=66 && D3>=66) return 'Porto-Seguro';
    if(D2<=40 && (fit_pragmatico||salvador||D3>=45)) return 'Construtor Pragmatico';
    if(D2>=66 && D2>=D1) return D4>=66?'Transformador Inquieto':'Decifrador';
    if(D1>=D2 && D1>=D3) return 'Porto-Seguro';
    if(D2>=D1 && D2>=D3) return D4>=66?'Transformador Inquieto':'Decifrador';
    return 'Construtor Pragmatico';
  })();

  var temperatura = D4>=66?'A':(D4>=34?'B':'C');
  if(r.Q14===4 && V('Q15','d4')<=15) temperatura='C';
  var fuga_mascarada = motivacao_fuga_alta && (r.Q15===1) && (r.Q13===2) && temperatura==='A';
  if(fuga_mascarada){ temperatura='B'; flags.push('fuga_mascarada'); }
  if(renda_proxy>=80 && invest_dispo<=60 && temperatura==='A') temperatura='B';

  var isFit = arquetipo!=='Realizador';
  var evidencia_prosocial_minima = (d3_procurado>=66)||(d3_ja_disseram>=66);
  var bolso_curto=false;
  if(renda_proxy<=35 && isFit && (temperatura==='A'||temperatura==='B')){
    bolso_curto=true; if(temperatura==='A') temperatura='B'; flags.push('bolso_curto');
  }

  var quality_score=(function(){
    var q=100;
    q-=Math.min(35,(telemetry.fastScreens||0)*8);
    if((telemetry.firstPosStreak||0)>=5) q-=25;
    q-=Math.min(30,(telemetry.blurEvents||0)*12);
    var dim={D1:[V('Q2','d1'),V('Q4','d1'),V('Q7','d1')],D2:[V('Q3','d2'),V('Q5','d2'),V('Q11','d2')],
      D3:[d3_procurado,V('Q8','d3'),d3_ja_disseram,V('Q10','d3')],D4:[V('Q14','d4'),V('Q15','d4'),V('Q17','d4')]};
    var contr=0;
    for(var d in dim){var a=dim[d]; if(Math.max.apply(null,a)-Math.min.apply(null,a)>60) contr+=30;}
    q-=Math.min(40,contr); return Math.max(0,q);
  })();
  var low_quality = quality_score<60;
  if(low_quality) flags.push('low_quality');

  var rota, cta_pago_aberto=false;
  if(low_quality){ rota='LOW_QUALITY'; }
  else if(arquetipo==='Realizador'){ rota='SAIDA_DIGNA'; }
  else if(!evidencia_prosocial_minima){ rota='SAIDA_DIGNA'; }
  else if(bolso_curto){ rota='TRILHA_PREPARACAO'; }
  else if(temperatura==='C'){ flags.push('CULTIVAR'); rota='CULTIVAR'; }
  else if((temperatura==='A'||temperatura==='B') && quality_score>=60){ rota='CTA_PAGO'; cta_pago_aberto=true; }
  else { rota='SAIDA_DIGNA'; }
  if(salvador) flags.push('salvador');
  if(motivacao_fuga) flags.push('motivacao_fuga');

  var eco1_ramo=(function(){
    if(!r.Q2&&!r.Q3&&!r.Q4&&!r.Q5) return null;
    var D1p=avg(V('Q2','d1'),V('Q4','d1')), D2p=avg(V('Q3','d2'),V('Q5','d2'));
    if(Math.max(D1p,D2p)<=33) return 'NEUTRO';
    return D1p>=D2p?'D1_DOM':'D2_DOM';
  })();
  var eco2_ramo=(function(){
    if(!r.Q6&&!r.Q8) return null;
    var D3p=avg(V('Q6','d3'),V('Q8','d3'));
    if(D3p>=66) return 'D3_ALTA';
    return d1_carrega>=66?'FALLBACK_CUSTO_A':'FALLBACK_CUSTO_B';
  })();

  var score_comercial=round(0.40*renda_proxy+0.35*invest_dispo+0.25*prontidao_invest);
  return {arquetipo:arquetipo,D1:round(D1),D2:round(D2),D3:round(D3),D4:round(D4),
    temperatura:temperatura,score_comercial:score_comercial,renda_proxy:renda_proxy,

// steps: {t:'q',q}, {t:'eco',n}
var STEPS=[];
(function(){
  var ecoAfter={Q5:1,Q8:2};

    STEPS.push({t:'q',q:QUESTIONS[i]});
    if(ecoAfter[QUESTIONS[i].id]) STEPS.push({t:'eco',n:ecoAfter[QUESTIONS[i].id]});
  }
})();
var TOTAL_Q=QUESTIONS.length;

var app=document.getElementById('app');
var pfill=document.getElementById('pfill');
var chaprot=document.getElementById('chaprot');

function answeredCount(){return Object.keys(state.answers).length;}
function setProgress(cap,extra){
  var pct=Math.min(100,(answeredCount()/TOTAL_Q)*100 + (extra||0));
  pfill.style.width=pct.toFixed(1)+'%';
  chaprot.textContent = cap ? ('cap. '+cap+' de 3') : '';
}

function vibrate(){try{if(navigator.vibrate)navigator.vibrate(8);}catch(e){}}

function shuffleOptions(q){
  var opts=q.o.slice();
  if(!q.rand) return opts;
  // Fisher-Yates
  for(var i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=opts[i];opts[i]=opts[j];opts[j]=t;}
  if(q.fixedTop){ // move a opção fixa pro topo
    var fi=-1; for(var k=0;k<opts.length;k++) if(opts[k].idx===q.fixedTop){fi=k;break;}
    if(fi>0){var f=opts.splice(fi,1)[0];opts.unshift(f);}
  }
  return opts;
}

function renderQuestion(step){
  var q=step.q;
  var opts;
  if(display[q.id]) opts=display[q.id]; else {opts=shuffleOptions(q);display[q.id]=opts;}
  var isScale=!q.rand;
  var html='<div class="screen">';
  html+='<div class="eyebrow">'+CAP_LABEL[q.cap]+'</div>';
  html+='<div class="q">'+q.q+'</div>';
  html+='<div class="opts">';
  var letters='ABCDEF';
  for(var i=0;i<opts.length;i++){
    var sel=state.answers[q.id]===opts[i].idx?' sel':'';
    html+='<button class="opt'+sel+'" data-idx="'+opts[i].idx+'" data-pos="'+i+'" style="animation-delay:'+(0.06*i+0.04).toFixed(2)+'s">'
      +'<span class="key">'+letters[i]+'</span><span>'+opts[i].txt+'</span></button>';
  }
  html+='</div>';
  if(state.step>0) html+='<button class="back" id="backBtn">← voltar</button>';
  html+='<div class="whisper" id="whisper">Não existe resposta certa. Vai no primeiro instinto.</div>';
  html+='</div>';
  app.innerHTML=html;
  window.scrollTo(0,0);
  setProgress(q.cap,0);
  screenShownAt=Date.now();

  var btns=app.querySelectorAll('.opt');
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener('click',function(){onAnswer(q,this,isScale);});
  }
  var back=document.getElementById('backBtn');
  if(back) back.addEventListener('click',goBack);

  // sussurro anti-paralisia após 20s de inatividade
  var wt=setTimeout(function(){var w=document.getElementById('whisper');if(w)w.classList.add('on');},20000);
  app._whisperTimer=wt;
}

function onAnswer(q,btnEl,isScale){
  if(app._whisperTimer)clearTimeout(app._whisperTimer);
  vibrate();
  var idx=parseInt(btnEl.getAttribute('data-idx'),10);
  var pos=parseInt(btnEl.getAttribute('data-pos'),10);
  var novo = state.answers[q.id]===undefined;
  state.answers[q.id]=idx;

  // telemetria: viés de 1ª posição (só em questões com peso randomizado)
  if(q.rand){
    if(pos===0){state.tel._streak++;state.tel.firstPosStreak=Math.max(state.tel.firstPosStreak,state.tel._streak);}
    else state.tel._streak=0;
  }
  // telemetria: tela de cenário respondida rápido demais (Q1-Q11)
  var qnum=parseInt(q.id.replace(/\D/g,''),10);
  if(qnum<=11 && !/b/.test(q.id) && (Date.now()-screenShownAt)<2500) state.tel.fastScreens++;

  // feedback visual: marca escolhida, esmaece as outras
  var all=app.querySelectorAll('.opt');
  for(var i=0;i<all.length;i++){
    if(all[i]===btnEl) all[i].classList.add('sel');
    else all[i].classList.add('dim');
    all[i].disabled=true;
  }
  save();
  setTimeout(next, isScale?340:360);
}

function renderEco(step){
  // calcula ramo com respostas parciais
  var partial=scoreVocation(state.answers,{});
  var txt, ramo;
  if(step.n===1){ramo=partial.eco1_ramo||'NEUTRO';txt=ECO1[ramo];}
  else {ramo=partial.eco2_ramo||'FALLBACK_CUSTO_B';txt=ECO2[ramo.replace('FALLBACK_CUSTO_A','FALLBACK_CUSTO_A')];}
  var html='<div class="screen eco">'
    +'<div class="spark">✦</div>'
    +'<div class="kick">Percebi uma coisa</div>'
    +'<div class="frase">“'+txt+'”</div>'
    +'<button class="btn" id="ecoNext">Continuar →</button>'
    +'</div>';
  app.innerHTML=html;window.scrollTo(0,0);
  setProgress(null,2);   // empurra a barra levemente, sem mexer no capítulo
  document.getElementById('ecoNext').addEventListener('click',function(){vibrate();next();});
}

function showStep(i){
  state.step=i;save();
  if(i>=STEPS.length){return startReveal();}
  var st=STEPS[i];
  // history para interceptar back nativo
  try{history.pushState({s:i},'');}catch(e){}
  if(st.t==='q') renderQuestion(st);
  else renderEco(st);
}
function next(){showStep(state.step+1);}
function goBack(){
  var i=state.step-1;
  while(i>=0 && STEPS[i] && STEPS[i].t==='eco') i--;   // pula ecos ao voltar
  if(i<0){return showOpening();}
  showStep(i);
}
window.addEventListener('popstate',function(){
  // evita abandono acidental: back nativo volta 1 pergunta em vez de sair
  if(state.step>0 && !result){try{history.pushState({s:state.step},'');}catch(e){}goBack();}
});

function buildPayload(email){
  return {email:email||state.email||null,nome:null,
    respostas:state.answers,
    telemetry:{blurEvents:state.tel.blurEvents,firstPosStreak:state.tel.firstPosStreak,fastScreens:state.tel.fastScreens},
    metadata:{startedAt:state.startedAt,finishedAt:Date.now(),ua:navigator.userAgent,titulo_variante:'A',
      client_result:result}};
}
function sealAndPost(email){
  if(posted)return;
  var body=JSON.stringify(buildPayload(email));
  postWithRetry(CONFIG.ENDPOINT,body,2).then(function(ok){if(ok){posted=true;clearSave();}});
}
function postWithRetry(url,body,tries){
  return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:body,keepalive:true})
    .then(function(r){if(r.ok)return true;throw new Error('http '+r.status);})
    .catch(function(){if(tries>0)return new Promise(function(res){setTimeout(res,900);}).then(function(){return postWithRetry(url,body,tries-1);});return false;});
}
// rede de segurança: se o POST não confirmou, tenta beacon ao sair da página
window.addEventListener('pagehide',function(){
  if(result && state.email && !posted && navigator.sendBeacon){
    try{navigator.sendBeacon(CONFIG.ENDPOINT,new Blob([JSON.stringify(buildPayload())],{type:'application/json'}));}catch(e){}
  }
});

/* card 9:16 via canvas (gerado on-demand, zero peso no load) */
function downloadCard(){
  var a=ARQ[result.arquetipo];
  var W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');
  // fundo
  var g=x.createRadialGradient(W/2,H*0.1,80,W/2,H*0.1,H);g.addColorStop(0,'#1a1509');g.addColorStop(0.6,'#050505');g.addColorStop(1,'#050505');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  // faíscas
  x.fillStyle='rgba(232,200,106,0.75)';
  for(var i=0;i<40;i++){var rx=Math.random()*W,ry=Math.random()*H,rr=Math.random()*2.5+1;x.beginPath();x.arc(rx,ry,rr,0,7);x.fill();}
  x.textAlign='center';
  // infinito
  x.fillStyle='#C8A84B';x.font='120px Georgia';x.fillText('∞',W/2,320);
  // constelação
  x.fillStyle='#9A7A2E';x.font='40px Georgia';x.fillText('✦  ✦  ✦',W/2,430);
  // label
  x.fillStyle='#c9bfa9';x.font='36px Arial';x.fillText('O MEU TALENTO É O DE',W/2,600);
  // nome (gradiente)
  var lg=x.createLinearGradient(W*0.15,0,W*0.85,0);lg.addColorStop(0,'#9A7A2E');lg.addColorStop(0.5,'#E8C86A');lg.addColorStop(1,'#C8A84B');
  x.fillStyle=lg;
  var nm=a.nome.toUpperCase();
  x.font='700 118px Georgia';
  wrapText(x,nm,W/2,760,W*0.86,120);
  // linha
  x.fillStyle='#C8A84B';x.fillRect(W/2-90,980,180,4);
  // assinatura
  x.fillStyle='#F5F0E8';x.font='italic 52px Georgia';
  wrapText(x,'“'+a.sig+'”',W/2,1120,W*0.82,72);
  // chamada
  x.fillStyle='#c9bfa9';x.font='44px Arial';
  x.fillText('Faça o seu mapa em 3 minutos',W/2,1560);
  x.fillStyle='#C8A84B';x.font='40px Arial';x.fillText(CONFIG.TEST_URL,W/2,1620);
  // rodapé
  x.fillStyle='#6B6B6B';x.font='34px Arial';x.fillText('OMNI · EST. 1979',W/2,1780);
  x.fillText('ISO 9001 · 46 ANOS',W/2,1830);
  // download
  try{
    c.toBlob(function(blob){
      var url=URL.createObjectURL(blob);var link=document.createElement('a');
      link.href=url;link.download='meu-talento-omni.png';document.body.appendChild(link);link.click();
      document.body.removeChild(link);setTimeout(function(){URL.revokeObjectURL(url);},4000);
    },'image/png');
  }catch(e){var d=c.toDataURL('image/png');window.open(d,'_blank');}
}
function wrapText(ctx,text,x,y,maxW,lh){
  var words=text.split(' '),line='',yy=y;
  for(var n=0;n<words.length;n++){
    var test=line+words[n]+' ';
    if(ctx.measureText(test).width>maxW && n>0){ctx.fillText(line.trim(),x,yy);line=words[n]+' ';yy+=lh;}
    else line=test;
  }
  ctx.fillText(line.trim(),x,yy);
}

(function boot(){
  var saved=load();
  if(saved && saved.a && Object.keys(saved.a).length>0 && saved.s>0 && saved.s<STEPS.length){
    state.answers=saved.a;state.step=saved.s;state.startedAt=saved.t;if(saved.tel)state.tel=saved.tel;
    // recomputa ordem de exibição para as questões já respondidas (mantém canônico)
    showOpening(true);
  } else {
    showOpening(false);
  }
})();
