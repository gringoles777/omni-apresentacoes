<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Plano Mestre · OMNI Brasil · Jun 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black:#050505;--dark:#0D0D0D;--dark-elevated:#1A1A1A;--dark-texture:#2D2D2D;
  --gold:#C8A84B;--gold-light:#E8C86A;--gold-deep:#9A7A2E;
  --cream:#F5F0E8;--cream-70:rgba(245,240,232,.70);--cream-50:rgba(245,240,232,.50);--cream-30:rgba(245,240,232,.30);
  --teal:#2A9D8F;--gray:#6B6B6B;--gray-dark:#242424;
  --gold-10:rgba(200,168,75,.10);--gold-20:rgba(200,168,75,.20);--gold-30:rgba(200,168,75,.30);
  --status-pending:#6B6B6B;--status-in_progress:#E8C86A;--status-blocked:#E74C3C;--status-done:#2A9D8F;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--black);color:var(--cream);min-height:100vh;font-family:'Inter',system-ui,sans-serif;line-height:1.5;padding-bottom:80px;}
a{color:var(--gold);text-decoration:none;}

header.topbar{position:sticky;top:0;z-index:100;background:rgba(5,5,5,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--gold-20);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.logo{font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;letter-spacing:5px;text-transform:uppercase;color:var(--gold);white-space:nowrap;}
.title-block{text-align:center;flex:1;}
.page-title{font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--cream);}
.page-sub{font-size:11px;color:var(--gray);letter-spacing:1px;margin-top:2px;}
.status-pill{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:4px 12px;border-radius:20px;border:1px solid var(--gold-20);color:var(--gold);}
.status-pill.live::before,.status-pill.offline::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;}
.status-pill.live::before{background:var(--teal);box-shadow:0 0 6px var(--teal);}
.status-pill.offline::before{background:var(--gray);}

.stats-bar{max-width:1200px;margin:24px auto 0;padding:0 32px;display:flex;gap:12px;flex-wrap:wrap;}
.stat-card{flex:1;min-width:90px;background:var(--dark-elevated);border:1px solid var(--gray-dark);border-radius:8px;padding:14px 18px;text-align:center;}
.stat-card .label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);margin-bottom:4px;}
.stat-card .value{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500;color:var(--cream);}
.stat-card.gold .value{color:var(--gold);}
.stat-card.teal .value{color:var(--teal);}

.offline-banner{display:none;max-width:1200px;margin:16px auto 0;padding:0 32px;}
.offline-inner{background:rgba(231,76,60,.12);border:1px solid rgba(231,76,60,.30);border-radius:8px;padding:12px 18px;font-size:12px;color:#E74C3C;line-height:1.6;}

.filter-row{max-width:1200px;margin:20px auto 0;padding:0 32px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.filter-row label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray);cursor:pointer;}
.filter-row input[type=checkbox]{accent-color:var(--gold);cursor:pointer;}
.filter-btn{padding:5px 14px;border-radius:20px;border:1px solid var(--gray-dark);background:transparent;color:var(--cream-50);font-size:11px;letter-spacing:1px;cursor:pointer;transition:all .2s;}
.filter-btn.active{border-color:var(--gold);color:var(--gold);background:var(--gold-10);}

.category-section{max-width:1200px;margin:32px auto 0;padding:0 32px;}
.category-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--gold-20);}
.category-icon{font-size:20px;}
.category-title{font-family:'Oswald',sans-serif;font-size:18px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--gold);}
.category-count{font-size:11px;color:var(--gray);background:var(--dark-elevated);border:1px solid var(--gray-dark);border-radius:12px;padding:2px 10px;font-family:'IBM Plex Mono',monospace;}

.project-group{margin-bottom:24px;}
.project-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin-bottom:10px;padding-left:10px;border-left:2px solid var(--gold-deep);}

.action-card{background:var(--dark-elevated);border:1px solid var(--gray-dark);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:border-color .2s,background .2s;overflow:hidden;}
.action-card:hover{border-color:var(--gold-20);background:#1F1F1F;}
.action-card.done{border-color:rgba(42,157,143,.25);opacity:.65;}
.action-card.blocked{border-color:rgba(231,76,60,.25);}
.action-card.in_progress{border-color:rgba(232,200,106,.30);}

.action-head{display:grid;grid-template-columns:1fr auto;align-items:start;padding:14px 18px;gap:12px;}
.action-left{display:flex;flex-direction:column;gap:8px;}
.action-title{font-size:14px;font-weight:500;color:var(--cream);line-height:1.4;}
.action-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

.ice-group{display:flex;align-items:center;gap:4px;}
.ice-badge{display:inline-flex;align-items:center;gap:3px;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid;}
.ice-badge.dim{color:var(--gray);border-color:var(--gray-dark);background:rgba(107,107,107,.08);}
.ice-badge.score{font-size:11px;font-weight:700;padding:3px 9px;}
.ice-badge.high{color:var(--teal);border-color:rgba(42,157,143,.35);background:rgba(42,157,143,.10);}
.ice-badge.mid{color:var(--gold);border-color:rgba(200,168,75,.35);background:var(--gold-10);}
.ice-badge.low{color:var(--gray);border-color:var(--gray-dark);background:rgba(107,107,107,.08);}

.chevron{color:var(--gray);font-size:12px;transition:transform .2s;align-self:center;flex-shrink:0;}
.action-card.expanded .chevron{transform:rotate(180deg);}

.action-detail{display:none;padding:0 18px 16px;border-top:1px solid var(--gray-dark);}
.action-card.expanded .action-detail{display:block;}

.claude-comment{background:rgba(200,168,75,.06);border:1px solid var(--gold-20);border-radius:6px;padding:10px 14px;margin:14px 0 12px;font-size:12px;color:var(--cream-70);line-height:1.6;}
.claude-comment .clabel{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-deep);margin-bottom:5px;font-weight:600;}

/* ICE EDIT */
.ice-edit-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.ice-edit-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);font-weight:600;}
.ice-edit-group{display:flex;gap:8px;align-items:center;}
.ice-edit-group label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--cream-70);}
.ice-num{width:46px;background:var(--dark);color:var(--cream);border:1px solid var(--gray-dark);border-radius:5px;padding:4px 6px;font-size:13px;font-family:'IBM Plex Mono',monospace;text-align:center;transition:border-color .2s;}
.ice-num:focus{outline:none;border-color:var(--gold);}
.ice-hint{font-size:10px;color:var(--gray);font-style:italic;}

.detail-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.status-select{background:var(--dark);color:var(--cream);border:1px solid var(--gray-dark);border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:'Inter',system-ui,sans-serif;transition:border-color .2s;}
.status-select:focus{outline:none;border-color:var(--gold);}
.status-select.pending{color:var(--status-pending);}
.status-select.in_progress{color:var(--status-in_progress);}
.status-select.blocked{color:var(--status-blocked);}
.status-select.done{color:var(--status-done);}

.note-input{width:100%;background:var(--dark);color:var(--cream);border:1px solid var(--gray-dark);border-radius:6px;padding:10px 12px;font-size:13px;font-family:'Inter',system-ui,sans-serif;line-height:1.5;resize:vertical;min-height:70px;transition:border-color .2s;margin-top:4px;}
.note-input:focus{outline:none;border-color:var(--gold);}
.note-input::placeholder{color:var(--gray);}

.save-row{display:flex;align-items:center;gap:10px;margin-top:8px;}
.save-btn{background:var(--gold);color:var(--black);border:none;border-radius:6px;padding:7px 18px;font-size:12px;font-weight:700;letter-spacing:.5px;cursor:pointer;font-family:'Inter',system-ui,sans-serif;transition:background .2s;}
.save-btn:hover{background:var(--gold-light);}
.save-btn:disabled{opacity:.5;cursor:not-allowed;}
.whoami-input{background:var(--dark);color:var(--cream);border:1px solid var(--gray-dark);border-radius:6px;padding:6px 10px;font-size:12px;width:130px;font-family:'Inter',system-ui,sans-serif;}
.whoami-input:focus{outline:none;border-color:var(--gold);}
.save-status{font-size:11px;color:var(--gray);}
.save-status.ok{color:var(--teal);}
.save-status.err{color:#E74C3C;}

footer{max-width:1200px;margin:48px auto 0;padding:0 32px 32px;text-align:center;font-size:11px;color:var(--gray);letter-spacing:.5px;}

@media(max-width:768px){
  header.topbar{padding:14px 20px;}
  .stats-bar,.category-section,.filter-row,.offline-banner{padding:0 16px;}
}
</style>
</head>
<body>

<header class="topbar">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL     = 'https://gdizgxysttvhvuetesvn.supabase.co';
const SUPABASE_ANON_KEY= 'sb_publishable_lxOqb25rvaA2oykxwIZ-Dg_0g33kwgS';
const LS_ICE_KEY       = 'pm_ice_overrides';

const TASKS = [
  {id:'pm-mv-01',cat:'NOVAS VENDAS',proj:'Máquina de Vendas',titulo:'Montar nova apresentação comercial',ice_i:3,ice_c:4,ice_e:3,com:'Alta alavancagem imediata — vendedores fecham mais com material forte'},
  {id:'pm-mv-02',cat:'NOVAS VENDAS',proj:'Máquina de Vendas',titulo:'Coletar depoimentos para cada persona',ice_i:3,ice_c:3,ice_e:2,com:'Prova social reduz objeções na hora do fechamento'},
  {id:'pm-mv-03',cat:'NOVAS VENDAS',proj:'Máquina de Vendas',titulo:'Implementar treino e rotina de alta performance comercial',ice_i:4,ice_c:3,ice_e:2,com:'Maior impacto de médio prazo — exige consistência e gestão da Rafa'},
  {id:'pm-ss-01',cat:'NOVAS VENDAS',proj:'Social Selling',titulo:'Criar novo processo/script de vendas',ice_i:3,ice_c:3,ice_e:3,com:'Problema atual é script fraco — resolver isso destrava o que a CLT já faz'},
  {id:'pm-ss-02',cat:'NOVAS VENDAS',proj:'Social Selling',titulo:'Criar gestor de SS com AIOX',ice_i:3,ice_c:3,ice_e:2,com:'Controle + evolução constante sem depender da memória do Michael'},
  {id:'pm-mkt-01',cat:'NOVAS VENDAS',proj:'Marketing',titulo:'Otimizar tráfego Meta (ad-midas + Tiago Kiss)',ice_i:4,ice_c:3,ice_e:3,com:'Canal de maior retorno imediato — já roda, otimizar é mais rápido que construir'},
  {id:'pm-mkt-02',cat:'NOVAS VENDAS',proj:'Marketing',titulo:'Lançar workshop de aquecimento para a base',ice_i:3,ice_c:3,ice_e:2,com:'Aquece quem já confia. Custo principal: tempo do Michael para preparar'},
  {id:'pm-mkt-03',cat:'NOVAS VENDAS',proj:'Marketing',titulo:'Montar plano de execução sem falha de conteúdo OMNI Brasil',ice_i:3,ice_c:3,ice_e:2,com:'Sem sistema, o conteúdo falha por inconsistência, não por falta de ideia'},
  {id:'pm-mkt-04',cat:'NOVAS VENDAS',proj:'Marketing',titulo:'Montar plano de execução sem falha de conteúdo michaelarruda',ice_i:3,ice_c:3,ice_e:2,com:'Audiência pessoal tem mais alcance — prioridade ligeiramente maior que @omnibr'},
  {id:'pm-lf-01',cat:'NOVAS VENDAS',proj:'Legacy Família',titulo:'Checar o planejamento atual',ice_i:3,ice_c:4,ice_e:4,com:'Antes de qualquer passo, saber onde está. Rápido de fazer'},
  {id:'pm-lf-02',cat:'NOVAS VENDAS',proj:'Legacy Família',titulo:'Atualizar cronograma',ice_i:3,ice_c:4,ice_e:3,com:'Desbloqueador de tudo — define próximos passos e deadline de vendas (julho)'},
  {id:'pm-lf-03',cat:'NOVAS VENDAS',proj:'Legacy Família',titulo:'Executar o evento (definir responsável)',ice_i:4,ice_c:2,ice_e:1,com:'Alto potencial de receita + upsell interno. Risco: logística e responsável dedicado'},
  {id:'pm-ax-01',cat:'NOVAS VENDAS',proj:'AIOX',titulo:'Construir IA CMO autônoma',ice_i:4,ice_c:3,ice_e:2,com:'Orquestra ads, conteúdo e social selling, delega para agentes e pessoas — elimina gargalo do Michael no marketing'},
  {id:'pm-ax-02',cat:'NOVAS VENDAS',proj:'AIOX',titulo:'Construir IA de suporte personalizada',ice_i:3,ice_c:3,ice_e:2,com:'Conhece cada aluno, melhora retenção e abre porta para upsell pelo contexto'},
  {id:'pm-ax-03',cat:'NOVAS VENDAS',proj:'AIOX',titulo:'Módulo de gamificação para incentivar indicação',ice_i:3,ice_c:2,ice_e:1,com:'Alta alavancagem em indicação qualificada — depende do portal estar maduro'},
  {id:'pm-bm-01',cat:'UPSELL',proj:'Black Mentoring',titulo:'Ativar bot de acompanhamento no WhatsApp/IG',ice_i:3,ice_c:3,ice_e:2,com:'Reduz churn silencioso — alunos que somem antes de renovar'},
  {id:'pm-bm-02',cat:'UPSELL',proj:'Black Mentoring',titulo:'Estruturar método claro para alunos atingirem resultado',ice_i:4,ice_c:3,ice_e:2,com:'Resultado do aluno = renovação + depoimento + indicação. Tudo deriva daqui'},
  {id:'pm-ot-01',cat:'OTIMIZAÇÃO DE TEMPO',proj:'Automação & Infra',titulo:'Migrar n8n para AIOX',ice_i:3,ice_c:3,ice_e:2,com:'Urgente — se n8n parar, operação para. Não é crescimento, é segurança'},
  {id:'pm-ot-02',cat:'OTIMIZAÇÃO DE TEMPO',proj:'Automação & Infra',titulo:'Integrar vendas → CS → financeiro',ice_i:3,ice_c:3,ice_e:2,com:'Hoje cada área é uma ilha — integrar elimina retrabalho e esquecimento'},
  {id:'pm-ot-03',cat:'OTIMIZAÇÃO DE TEMPO',proj:'Automação & Infra',titulo:'Colocar financeiro no AIOX',ice_i:3,ice_c:3,ice_e:2,com:'Decisão financeira hoje depende de Excel e memória — AIOX dá visibilidade em tempo real'},
  {id:'pm-gt-01',cat:'OTIMIZAÇÃO DE TEMPO',proj:'Gestão',titulo:'Montar Executor Matrix + organograma',ice_i:3,ice_c:3,ice_e:2,com:'Mapa de cada função: contratar, automatizar ou eliminar. Desbloqueador de decisões de custo'},
  {id:'pm-hf-01',cat:'PROJETOS PARALELOS',proj:'HypnoFlash',titulo:'Estruturar funil com fornecedor externo',ice_i:3,ice_c:2,ice_e:2,com:'Upside real mas depende de fornecedor externo — incerteza alta'},
  {id:'pm-hf-02',cat:'PROJETOS PARALELOS',proj:'HypnoFlash',titulo:'Gravar aulas',ice_i:2,ice_c:3,ice_e:1,com:'Necessário para o produto existir — fazer quando houver espaço no Michael'},
];

const CAT_ICONS={'NOVAS VENDAS':'💰','UPSELL':'🔄','OTIMIZAÇÃO DE TEMPO':'⚙️','PROJETOS PARALELOS':'🔵'};

let supabase=null, dbData={}, iceOverrides={}, activeCat='all';

function loadIceOverrides(){ try{ iceOverrides=JSON.parse(localStorage.getItem(LS_ICE_KEY)||'{}'); }catch(e){ iceOverrides={}; } }
function saveIceOverrides(){ localStorage.setItem(LS_ICE_KEY, JSON.stringify(iceOverrides)); }

function getIce(task){
  const ov=iceOverrides[task.id]||{};
  return { i: ov.i??task.ice_i, c: ov.c??task.ice_c, e: ov.e??task.ice_e };
}
function iceTotal(task){ const v=getIce(task); return v.i+v.c+v.e; }
function iceClass(s){ return s>=10?'high':s>=7?'mid':'low'; }
function escapeHTML(s){ const d=document.createElement('div');d.textContent=s;return d.innerHTML; }
function getState(task){ const r=dbData[task.id]; return {status:r?.status||'pending',nota:r?.nota_atual||''}; }

async function init(){
  loadIceOverrides();
  const pill=document.getElementById('conn-pill');
  const banner=document.getElementById('offline-banner');

  if(typeof window.supabase==='undefined'){
    pill.className='status-pill offline';pill.textContent='Offline';
    banner.style.display='block';
    render();return;
  }

  supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const {data,error}=await supabase.from('plano_acao_tasks').select('*').in('id',TASKS.map(t=>t.id));

  if(error){
    pill.className='status-pill offline';pill.textContent='Erro DB';
    banner.style.display='block';
    document.getElementById('offline-msg').innerHTML=`<strong>Erro Supabase:</strong> ${error.message}`;
  } else {
    (data||[]).forEach(r=>{ dbData[r.id]=r; });
  }
  render();
}

function render(){
  const hideDone=document.getElementById('hide-done').checked;
  const cats=[...new Set(TASKS.map(t=>t.cat))];
  let html='';

  cats.forEach(cat=>{
    if(activeCat!=='all'&&activeCat!==cat) return;
    const catTasks=TASKS.filter(t=>t.cat===cat);
    const projs=[...new Set(catTasks.map(t=>t.proj))];

    html+=`<div class="category-section">
      <div class="category-header">
        <span class="category-icon">${CAT_ICONS[cat]||'📌'}</span>
        <span class="category-title">${cat}</span>
        <span class="category-count">${catTasks.length} ações</span>
      </div>`;

    projs.forEach(proj=>{
      html+=`<div class="project-group"><div class="project-label">${proj}</div>`;
      catTasks.filter(t=>t.proj===proj).forEach(task=>{
        const state=getState(task);
        if(hideDone&&state.status==='done') return;
        const ice=getIce(task);
        const total=ice.i+ice.c+ice.e;
        const cls=iceClass(total);

        html+=`<div class="action-card ${state.status}" data-id="${task.id}" onclick="toggleCard(this)">
          <div class="action-head">
            <div class="action-left">
              <div class="action-title">${escapeHTML(task.titulo)}</div>
              <div class="action-meta">
                <div class="ice-group" id="ice-badges-${task.id}">
                  <span class="ice-badge dim">I:${ice.i}</span>
                  <span class="ice-badge dim">C:${ice.c}</span>
                  <span class="ice-badge dim">E:${ice.e}</span>
                  <span class="ice-badge score ${cls}">ICE ${total}</span>
                </div>
              </div>
            </div>
            <span class="chevron">▼</span>
          </div>
          <div class="action-detail">
            <div class="claude-comment">
              <div class="clabel">Sugestão Claude</div>
              ${escapeHTML(task.com)}
            </div>
            <div class="ice-edit-row" onclick="event.stopPropagation()">
              <span class="ice-edit-label">Ajustar ICE:</span>
              <div class="ice-edit-group">
                <label>I <input type="number" class="ice-num" min="1" max="4" value="${ice.i}" data-id="${task.id}" data-dim="i" oninput="updateIce(this)"></label>
                <label>C <input type="number" class="ice-num" min="1" max="4" value="${ice.c}" data-id="${task.id}" data-dim="c" oninput="updateIce(this)"></label>
                <label>E <input type="number" class="ice-num" min="1" max="4" value="${ice.e}" data-id="${task.id}" data-dim="e" oninput="updateIce(this)"></label>
              </div>
              <span class="ice-hint">escala 1–4, salva no seu browser</span>
            </div>
            <div class="detail-controls" onclick="event.stopPropagation()">
              <select class="status-select ${state.status}" data-id="${task.id}" onchange="event.stopPropagation();this.className='status-select '+this.value">
                <option value="pending"     ${state.status==='pending'    ?'selected':''}>Pendente</option>
                <option value="in_progress" ${state.status==='in_progress'?'selected':''}>Em progresso</option>
                <option value="blocked"     ${state.status==='blocked'    ?'selected':''}>Bloqueada</option>
                <option value="done"        ${state.status==='done'       ?'selected':''}>Concluída</option>
              </select>
            </div>
            <textarea class="note-input" data-id="${task.id}" placeholder="Seu comentário — contexto, decisão, próximo passo..." onclick="event.stopPropagation()">${state.nota?escapeHTML(state.nota):''}</textarea>
            <div class="save-row">
              <button class="save-btn" onclick="event.stopPropagation();saveTask('${task.id}',this)">Salvar</button>
              <input class="whoami-input" type="text" placeholder="Seu nome" value="${escapeHTML(localStorage.getItem('whoami')||'')}" onclick="event.stopPropagation()">
              <span class="save-status" id="ss-${task.id}"></span>
            </div>
          </div>
        </div>`;
      });
      html+=`</div>`;
    });
    html+=`</div>`;
  });

  document.getElementById('board').innerHTML=html;
  updateStats();
}

function toggleCard(card){
  if(event.target.closest('.status-select,.note-input,.save-btn,.whoami-input,.ice-num')) return;
  card.classList.toggle('expanded');
}

function updateIce(input){
  const id=input.dataset.id;
  const dim=input.dataset.dim;
  const val=Math.min(4,Math.max(1,parseInt(input.value)||1));
  input.value=val;
  if(!iceOverrides[id]) iceOverrides[id]={};
  iceOverrides[id][dim]=val;
  saveIceOverrides();

  // atualiza badges em tempo real
  const task=TASKS.find(t=>t.id===id);
  const ice=getIce(task);
  const total=ice.i+ice.c+ice.e;
  const cls=iceClass(total);
  const badgeEl=document.getElementById(`ice-badges-${id}`);
  if(badgeEl){
    badgeEl.innerHTML=`
      <span class="ice-badge dim">I:${ice.i}</span>
      <span class="ice-badge dim">C:${ice.c}</span>
      <span class="ice-badge dim">E:${ice.e}</span>
      <span class="ice-badge score ${cls}">ICE ${total}</span>`;
  }
}

function filterCat(btn){
  activeCat=btn.dataset.cat;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

async function saveTask(id,btn){
  const card=document.querySelector(`.action-card[data-id="${id}"]`);
  const statusSel=card.querySelector('.status-select');
  const noteInput=card.querySelector('.note-input');
  const whoamiEl=card.querySelector('.whoami-input');
  const statusEl=document.getElementById(`ss-${id}`);
  const whoami=whoamiEl.value.trim()||'anon';
  localStorage.setItem('whoami',whoamiEl.value.trim());

  const payload={status:statusSel.value,nota_atual:noteInput.value,atualizado_por:whoami};
  dbData[id]={...(dbData[id]||{}),id,...payload};
  card.className=`action-card expanded ${payload.status}`;

  if(!supabase){statusEl.className='save-status ok';statusEl.textContent='✓ local';return;}
  btn.disabled=true;statusEl.className='save-status';statusEl.textContent='Salvando...';

  const {data,error}=await supabase.from('plano_acao_tasks').update(payload).eq('id',id).select();
  btn.disabled=false;
  if(error){statusEl.className='save-status err';statusEl.textContent='Erro: '+error.message;}
  else if(!data||data.length===0){statusEl.className='save-status err';statusEl.textContent='Erro: registro não existe no banco (rodar seed)';}
  else{statusEl.className='save-status ok';statusEl.textContent='✓ Salvo';setTimeout(()=>{statusEl.textContent='';},3000);}
  updateStats();
}

function updateStats(){
  const all=TASKS.map(t=>getState(t).status);
  document.getElementById('stat-done').textContent =all.filter(s=>s==='done').length;
  document.getElementById('stat-prog').textContent =all.filter(s=>s==='in_progress').length;
  document.getElementById('stat-blk').textContent  =all.filter(s=>s==='blocked').length;
  document.getElementById('stat-pend').textContent =all.filter(s=>s==='pending').length;
}

document.getElementById('hide-done').addEventListener('change',render);
init();
</script>
</body>
</html>
