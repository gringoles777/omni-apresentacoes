:root {
  --black: #050505;
  --dark: #0D0D0D;

  --gray: #6B6B6B;

  --gold-20: rgba(200,168,75,0.20);
  --gold-30: rgba(200,168,75,0.30);

  --status-in_progress: #E8C86A;

  --ice-mid: #E8C86A;
  --ice-low: #6B6B6B;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--black);color:var(--cream);min-height:100vh;font-family:'Inter',system-ui,sans-serif;line-height:1.5;padding-bottom:80px;}
a{color:var(--gold);text-decoration:none;}

/* TOPBAR */
header.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(5,5,5,0.96);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--gold-20);
  padding:18px 32px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.logo{font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;letter-spacing:5px;text-transform:uppercase;color:var(--gold);white-space:nowrap;}
.title-block{text-align:center;flex:1;}
.page-title{font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--cream);}
.page-sub{font-size:11px;color:var(--gray);letter-spacing:1px;margin-top:2px;}
.status-pill{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:4px 12px;border-radius:20px;border:1px solid var(--gold-20);color:var(--gold);}
.status-pill.live::before,.status-pill.offline::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;}
.status-pill.live::before{background:var(--teal);box-shadow:0 0 6px var(--teal);}
.status-pill.offline::before{background:var(--gray);}

/* STATS */
.stats-bar{max-width:1200px;margin:24px auto 0;padding:0 32px;display:flex;gap:12px;flex-wrap:wrap;}
.stat-card{flex:1;min-width:100px;background:var(--dark-elevated);border:1px solid var(--gray-dark);border-radius:8px;padding:14px 18px;text-align:center;}
.stat-card .label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);margin-bottom:4px;}
.stat-card .value{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500;color:var(--cream);}
.stat-card.gold .value{color:var(--gold);}
.stat-card.teal .value{color:var(--teal);}

/* OFFLINE BANNER */
.offline-banner{display:none;max-width:1200px;margin:16px auto 0;padding:0 32px;}
.offline-inner{background:rgba(231,76,60,0.12);border:1px solid rgba(231,76,60,0.30);border-radius:8px;padding:12px 18px;font-size:12px;color:#E74C3C;line-height:1.6;}

/* FILTER */
.filter-row{max-width:1200px;margin:20px auto 0;padding:0 32px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.filter-row label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray);cursor:pointer;}
.filter-row input[type=checkbox]{accent-color:var(--gold);cursor:pointer;}
.filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--gray-dark);background:transparent;color:var(--cream-50);font-size:11px;letter-spacing:1px;cursor:pointer;transition:all .2s;}
.filter-btn.active{border-color:var(--gold);color:var(--gold);background:var(--gold-10);}

/* CATEGORY */
.category-section{max-width:1200px;margin:32px auto 0;padding:0 32px;}
.category-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--gold-20);}
.category-icon{font-size:20px;}
.category-title{font-family:'Oswald',sans-serif;font-size:18px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--gold);}
.category-count{font-size:11px;color:var(--gray);background:var(--dark-elevated);border:1px solid var(--gray-dark);border-radius:12px;padding:2px 10px;font-family:'IBM Plex Mono',monospace;}

/* PROJECT GROUP */
.project-group{margin-bottom:28px;}
.project-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin-bottom:10px;padding-left:4px;border-left:2px solid var(--gold-deep);padding-left:10px;}

/* ACTION CARD */
.action-card{
  background:var(--dark-elevated);border:1px solid var(--gray-dark);
  border-radius:8px;margin-bottom:8px;cursor:pointer;
  transition:border-color .2s,background .2s;
  overflow:hidden;
}
.action-card:hover{border-color:var(--gold-20);background:#1F1F1F;}
.action-card.done{border-color:rgba(42,157,143,0.25);opacity:0.65;}
.action-card.blocked{border-color:rgba(231,76,60,0.25);}
.action-card.in_progress{border-color:rgba(232,200,106,0.30);}

.action-head{display:grid;grid-template-columns:1fr auto;align-items:start;padding:14px 18px;gap:12px;}
.action-left{display:flex;flex-direction:column;gap:8px;}
.action-title{font-size:14px;font-weight:500;color:var(--cream);line-height:1.4;}
.action-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

.ice-group{display:flex;align-items:center;gap:4px;}
.ice-badge{display:inline-flex;align-items:center;gap:3px;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid;}
.ice-badge.dim{color:var(--gray);border-color:var(--gray-dark);background:rgba(107,107,107,0.08);}
.ice-badge.score{font-size:11px;font-weight:700;padding:3px 9px;}
.ice-badge.high{color:var(--teal);border-color:rgba(42,157,143,0.35);background:rgba(42,157,143,0.10);}
.ice-badge.mid{color:var(--gold);border-color:rgba(200,168,75,0.35);background:var(--gold-10);}
.ice-badge.low{color:var(--gray);border-color:var(--gray-dark);background:rgba(107,107,107,0.08);}

.chevron{color:var(--gray);font-size:12px;transition:transform .2s;align-self:center;flex-shrink:0;}
.action-card.expanded .chevron{transform:rotate(180deg);}

.action-card.expanded .action-detail{display:block;}

.status-select.in_progress{color:var(--status-in_progress);}
.status-select.blocked{color:var(--status-blocked);}
.status-select.done{color:var(--status-done);}

.note-input:focus{outline:none;border-color:var(--gold);}
.note-input::placeholder{color:var(--gray);}

  transition:background .2s;

.save-btn:hover{background:var(--gold-light);}
.save-btn:disabled{opacity:.5;cursor:not-allowed;}

  background:var(--dark);color:var(--cream);border:1px solid var(--gray-dark);

footer{max-width:1200px;margin:48px auto 0;padding:0 32px 32px;text-align:center;font-size:11px;color:var(--gray);letter-spacing:.5px;}

@media(max-width:768px){
  header.topbar{padding:14px 20px;}
  .stats-bar,.category-section,.filter-row,.offline-banner{padding:0 16px;}
  .action-head{grid-template-columns:1fr auto;}

</style>

function iceClass(score){ return score >= 22 ? 'high' : score >= 19 ? 'mid' : 'low'; }
function escapeHTML(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

async function init(){
  const pill = document.getElementById('conn-pill');
  const banner = document.getElementById('offline-banner');
  const msg = document.getElementById('offline-msg');

  if(!SUPABASE_READY){
    pill.className='status-pill offline'; pill.textContent='Offline';
    banner.style.display='block'; msg.innerHTML='<strong>Config:</strong> credenciais Supabase não configuradas.';
    render(); return;
  }

  if(typeof window.supabase === 'undefined'){
    pill.className='status-pill offline'; pill.textContent='Offline';
    banner.style.display='block'; msg.innerHTML='<strong>CDN Supabase não carregou.</strong> Verifique conexão.';
    render(); return;
  }

  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Buscar dados existentes
  const ids = TASKS.map(t=>`'${t.id}'`).join(',');
  const { data, error } = await supabase
    .from('plano_acao_tasks')
    .select('*')
    .in('id', TASKS.map(t=>t.id));

  if(error){
    pill.className='status-pill offline'; pill.textContent='Erro DB';
    banner.style.display='block'; msg.innerHTML=`<strong>Erro Supabase:</strong> ${error.message}`;
  } else {
    (data||[]).forEach(row=>{ dbData[row.id]=row; });
    pill.className='status-pill live'; pill.textContent='Conectado';
  }

  render();
}

function getTaskState(task){
  const row = dbData[task.id];
  return {
    status: row?.status || task.status,
    nota: row?.nota_atual || '',
  };

  const hideDone = document.getElementById('hide-done').checked;
  const board = document.getElementById('board');

  // Group by category > project
  const cats = [...new Set(TASKS.map(t=>t.categoria))];

  let html = '';
  cats.forEach(cat => {
    if(activeCat !== 'all' && activeCat !== cat) return;

    const catTasks = TASKS.filter(t => t.categoria === cat);
    const projects = [...new Set(catTasks.map(t=>t.projeto))];

    html += `<div class="category-section" data-cat="${cat}">
      <div class="category-header">
        <span class="category-icon">${CAT_ICONS[cat]||'📌'}</span>
        <span class="category-title">${cat}</span>
        <span class="category-count">${catTasks.length} ações</span>
      </div>`;

    projects.forEach(proj => {
      const projTasks = catTasks.filter(t => t.projeto === proj);
      html += `<div class="project-group"><div class="project-label">${proj}</div>`;

      projTasks.forEach(task => {
        const state = getTaskState(task);
        if(hideDone && state.status === 'done') return;

        const ice = task.ice_i + task.ice_c + task.ice_e;
        const cls = iceClass(ice);

        html += `<div class="action-card ${state.status}" data-id="${task.id}" data-cat="${cat}" onclick="toggleCard(this)">
          <div class="action-head">
            <div class="action-left">
              <div class="action-title">${escapeHTML(task.titulo)}</div>
              <div class="action-meta">
                <div class="ice-group">
                  <span class="ice-badge dim">I:${task.ice_i}</span>
                  <span class="ice-badge dim">C:${task.ice_c}</span>
                  <span class="ice-badge dim">E:${task.ice_e}</span>
                  <span class="ice-badge score ${cls}">ICE ${ice}</span>
                </div>
              </div>
            </div>
            <span class="chevron">▼</span>
          </div>
          <div class="action-detail">
            <div class="claude-comment">
              <div class="label">Análise Claude</div>
              ${escapeHTML(task.comentario)}
            </div>
            <select class="status-select ${state.status}" data-id="${task.id}" onclick="event.stopPropagation()" onchange="event.stopPropagation();this.className='status-select '+this.value">
              <option value="pending" ${state.status==='pending'?'selected':''}>Pendente</option>
              <option value="in_progress" ${state.status==='in_progress'?'selected':''}>Em progresso</option>
              <option value="blocked" ${state.status==='blocked'?'selected':''}>Bloqueada</option>
              <option value="done" ${state.status==='done'?'selected':''}>Concluída</option>
            </select>
            <textarea class="note-input" data-id="${task.id}" placeholder="Seu comentário — contexto, decisão, próximo passo...">${state.nota ? escapeHTML(state.nota) : ''}</textarea>
            <div class="save-row">
              <button class="save-btn" data-id="${task.id}" onclick="event.stopPropagation();saveTask('${task.id}',this)">Salvar</button>
              <input class="whoami-input" data-id="${task.id}" type="text" placeholder="Seu nome" value="${escapeHTML(localStorage.getItem('whoami')||'')}" onclick="event.stopPropagation()">
              <span class="save-status" id="save-status-${task.id}"></span>
            </div>
          </div>
        </div>`;
      });

      html += `</div>`;
    });
    html += `</div>`;
  });

  board.innerHTML = html;
  updateStats();
}

function toggleCard(card){
  if(event.target.closest('.status-select,.note-input,.save-btn,.whoami-input')) return;
  card.classList.toggle('expanded');
}

function filterCat(btn){
  activeCat = btn.dataset.cat;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

async function saveTask(id, btn){
  const card = document.querySelector(`.action-card[data-id="${id}"]`);
  const statusSel = card.querySelector('.status-select');
  const noteInput = card.querySelector('.note-input');
  const whoamiInput = card.querySelector('.whoami-input');
  const statusEl = document.getElementById(`save-status-${id}`);

  const whoami = whoamiInput.value.trim() || 'anon';
  localStorage.setItem('whoami', whoamiInput.value.trim());

  const payload = {
    status: statusSel.value,
    nota_atual: noteInput.value,
    updated_at: new Date().toISOString(),
    updated_by: whoami,
  };

  // Optimistic update
  dbData[id] = { ...(dbData[id]||{}), id, ...payload };
  card.className = `action-card expanded ${payload.status}`;

  if(!supabase){ statusEl.className='save-status ok'; statusEl.textContent='✓ local'; return; }

  btn.disabled = true;
  statusEl.className='save-status'; statusEl.textContent='Salvando...';

  const { error } = await supabase
    .from('plano_acao_tasks')
    .upsert({ id, ...payload }, { onConflict: 'id' })
    .select();

  btn.disabled = false;
  if(error){
    statusEl.className='save-status err'; statusEl.textContent='Erro: '+error.message;
  } else {
    statusEl.className='save-status ok'; statusEl.textContent='✓ Salvo';
    setTimeout(()=>{ statusEl.textContent=''; }, 3000);
  }
  updateStats();
}

function updateStats(){
  const all = TASKS.map(t => getTaskState(t).status);
  document.getElementById('stat-done').textContent     = all.filter(s=>s==='done').length;
  document.getElementById('stat-progress').textContent = all.filter(s=>s==='in_progress').length;
  document.getElementById('stat-blocked').textContent  = all.filter(s=>s==='blocked').length;
  document.getElementById('stat-pending').textContent  = all.filter(s=>s==='pending').length;
}

document.getElementById('hide-done').addEventListener('change', render);

init();
</script>
</body>
</html>
