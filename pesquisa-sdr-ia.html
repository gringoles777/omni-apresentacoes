<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pesquisa Web · SDR-IA OMNI Brasil (Protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=DM+Serif+Display&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Open+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#050505; --bg2:#0D0D0D; --dark:#1A1A1A; --panel:#111111;
    --ink:#F5F0E8; --ink-soft:rgba(245,240,232,.66); --ink-faint:rgba(245,240,232,.36);
    --gold:#C8A84B; --gold-light:#E8C86A; --gold-deep:#9A7A2E;
    --gold-line:rgba(200,168,75,.18); --gold-line-strong:rgba(200,168,75,.42); --gold-10:rgba(200,168,75,.08);
    --navy:#0A1628; --teal:#2A9D8F; --gray:#6B6B6B; --alert:#E07A5F;
    --oswald:'Oswald',sans-serif; --serif:'DM Serif Display',serif; --corm:'Cormorant Garamond',serif;
    --body:'Open Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}

  /* ============ GATE ============ */
  #gate{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
  body:not(.locked) #gate{display:none}
  body.locked{overflow:hidden}
  #gate .glock{width:34px;height:34px;margin-bottom:2px}
  #gate .glogo{font-family:var(--oswald);font-weight:700;font-size:28px;letter-spacing:7px;color:var(--gold);text-transform:uppercase}
  #gate .gsub{font-family:var(--mono);font-size:12px;letter-spacing:3px;color:var(--ink-soft);text-transform:uppercase}
  #gate input{font-family:var(--mono);background:#000;border:1px solid var(--gold-line);color:var(--ink);padding:14px 20px;border-radius:0;font-size:16px;text-align:center;width:min(300px,80vw);outline:none}
  #gate input:focus{border-color:var(--gold)}
  #gate .gerr{color:var(--alert);font-size:13px;font-family:var(--mono);display:none}
  #gate .ghint{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--ink-faint)}

  /* ============ PAGE HEADER (sticky, obrigatório) ============ */
  .pagehead{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid rgba(200,168,75,.15)}
  .pagehead .row{max-width:460px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
  .pagehead .brand{font-family:var(--oswald);font-weight:700;font-size:16px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;white-space:nowrap}
  .pagehead .iso{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--gold);border:1px solid var(--gold-line-strong);padding:3px 8px;text-transform:uppercase;white-space:nowrap}
  .pagehead .reset{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--ink-faint);background:none;border:none;cursor:pointer;text-transform:uppercase;padding:4px}
  .pagehead .reset:hover{color:var(--gold)}

  /* progress */
  .progress{height:2px;background:transparent;max-width:460px;margin:0 auto}
  .progress .bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold-deep),var(--gold-light));transition:width .5s ease}

  /* ============ CHAT SHELL ============ */
  .shell{max-width:460px;margin:0 auto;min-height:calc(100vh - 47px);display:flex;flex-direction:column}
  .protobar{font-family:var(--mono);font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-faint);text-align:center;padding:8px 12px;border-bottom:1px solid var(--gold-line)}
  .protobar b{color:var(--gold-deep);font-weight:500}

  .chat{flex:1;padding:20px 16px 8px;display:flex;flex-direction:column;gap:14px}

  /* rows */
  .row{display:flex;gap:9px;align-items:flex-end;opacity:0;transform:translateY(8px);animation:pop .32s ease forwards}
  @keyframes pop{to{opacity:1;transform:none}}
  .row.bot{justify-content:flex-start}
  .row.lead{justify-content:flex-end}

  /* avatar */
  .av{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1c1c1c,#0a0a0a);border:1px solid var(--gold-line-strong);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .av svg{width:22px;height:auto;display:block}
  .av.ghost{visibility:hidden}

  /* bubbles */
  .bubble{max-width:78%;font-size:14.5px;line-height:1.5;padding:11px 14px;border-radius:8px;word-wrap:break-word}
  .row.bot .bubble{background:var(--dark);border:1px solid var(--gold-line);color:var(--ink);border-bottom-left-radius:2px}
  .row.lead .bubble{background:var(--gold);color:#0D0D0D;font-weight:600;border-bottom-right-radius:2px}
  .bubble .em{color:var(--gold-light)}
  .row.lead .bubble .em{color:#0D0D0D}
  .bubble.affirm{background:transparent;border:1px solid var(--gold-line);color:var(--gold-light);font-family:var(--corm);font-style:italic;font-size:16px;line-height:1.4}

  /* consultora meta line */
  .whoami{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin:2px 0 -6px 43px}

  /* typing */
  .typing{display:flex;gap:4px;padding:13px 15px}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--gold-deep);animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  /* ============ INPUT DOCK ============ */
  .dock{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,var(--bg) 22%);padding:10px 16px calc(16px + env(safe-area-inset-bottom));max-width:460px;margin:0 auto;width:100%}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{font-family:var(--body);font-size:14.5px;font-weight:600;text-align:left;color:var(--ink);background:var(--bg2);border:1px solid var(--gold-line-strong);border-radius:8px;padding:13px 15px;cursor:pointer;transition:background .18s,border-color .18s,color .18s;line-height:1.35}
  .opt:hover,.opt:focus{background:var(--gold-10);border-color:var(--gold);color:var(--gold-light);outline:none}
  .opt.sel{background:var(--gold);color:#0D0D0D;border-color:var(--gold)}

  /* CTA primary */
  .cta{font-family:var(--oswald);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:15px;color:#0D0D0D;background:var(--gold);border:none;border-radius:0;padding:15px 18px;cursor:pointer;width:100%;transition:box-shadow .2s,background .2s}
  .cta:hover{background:var(--gold-light);box-shadow:0 0 22px rgba(200,168,75,.35)}

  /* multi */
  .multi-hint{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px}
  .opt.check{display:flex;align-items:center;gap:11px}
  .opt.check .box{width:18px;height:18px;flex:0 0 18px;border:1px solid var(--gold-line-strong);border-radius:3px;display:flex;align-items:center;justify-content:center}
  .opt.check.on{border-color:var(--gold);background:var(--gold-10);color:var(--gold-light)}
  .opt.check.on .box{background:var(--gold);border-color:var(--gold)}
  .opt.check.on .box:after{content:"";width:5px;height:9px;border:solid #0D0D0D;border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-2px}

  /* scale 0-10 */
  .scale{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
  .chip{font-family:var(--mono);font-size:15px;color:var(--ink);background:var(--bg2);border:1px solid var(--gold-line-strong);border-radius:8px;padding:11px 0;text-align:center;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
  .chip:hover{background:var(--gold-10);border-color:var(--gold);color:var(--gold-light)}
  .scale-legend{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);margin-top:7px}

  /* text input */
  .tinput{display:flex;gap:8px;align-items:flex-end}
  .tinput textarea{flex:1;font-family:var(--body);font-size:14.5px;color:var(--ink);background:var(--bg2);border:1px solid var(--gold-line-strong);border-radius:8px;padding:12px 14px;resize:none;outline:none;line-height:1.4;max-height:120px}
  .tinput textarea:focus{border-color:var(--gold)}
  .tinput textarea::placeholder{color:var(--ink-faint)}
  .send{font-family:var(--oswald);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:#0D0D0D;background:var(--gold);border:none;border-radius:8px;padding:12px 15px;cursor:pointer;white-space:nowrap;align-self:stretch}
  .send:hover{background:var(--gold-light)}
  .skip{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);background:none;border:none;cursor:pointer;margin-top:8px;display:block}
  .skip:hover{color:var(--gold)}

  /* ============ AGENDA (Cal.com style) ============ */
  .agenda{display:flex;flex-direction:column;gap:9px}
  .slot{display:flex;align-items:center;gap:13px;background:var(--bg2);border:1px solid var(--gold-line-strong);border-radius:8px;padding:13px 15px;cursor:pointer;transition:background .18s,border-color .18s}
  .slot:hover{background:var(--gold-10);border-color:var(--gold)}
  .slot .cal{width:42px;height:42px;flex:0 0 42px;border:1px solid var(--gold-line-strong);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
  .slot .cal .m{font-family:var(--mono);font-size:8px;letter-spacing:1px;text-transform:uppercase;color:#0D0D0D;background:var(--gold);width:100%;text-align:center;padding:1px 0;font-weight:500}
  .slot .cal .d{font-family:var(--oswald);font-weight:700;font-size:19px;color:var(--ink);line-height:1;margin-top:3px}
  .slot .info{flex:1}
  .slot .info .day{font-family:var(--oswald);font-weight:600;font-size:14.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink)}
  .slot .info .time{font-family:var(--mono);font-size:12px;color:var(--gold-light);margin-top:2px}
  .slot .arr{color:var(--gold);font-size:18px}
  .agenda-note{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--ink-faint);text-align:center;margin-top:4px}

  /* result banners */
  .banner{border-radius:8px;padding:16px 16px;font-size:14px;line-height:1.55}
  .banner.ok{background:linear-gradient(135deg,rgba(200,168,75,.12),rgba(200,168,75,.03));border:1px solid var(--gold-line-strong)}
  .banner.alt{background:rgba(42,157,143,.07);border:1px solid rgba(42,157,143,.32)}
  .banner .tag{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
  .banner.ok .tag{color:var(--gold)}
  .banner.alt .tag{color:var(--teal)}
  .banner h4{font-family:var(--oswald);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:16px;margin-bottom:6px;color:var(--ink)}
  .banner p{color:var(--ink-soft)}

  .final{text-align:center;padding:26px 12px 10px}
  .final .inf{width:56px;height:auto;margin:0 auto 14px;display:block;opacity:.9}
  .final h3{font-family:var(--serif);font-weight:400;font-size:22px;color:var(--ink);margin-bottom:8px;line-height:1.2}
  .final p{font-size:13.5px;color:var(--ink-soft);max-width:340px;margin:0 auto}
  .final .restart{margin-top:20px;font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);background:none;border:1px solid var(--gold-line-strong);border-radius:0;padding:11px 18px;cursor:pointer}
  .final .restart:hover{background:var(--gold-10);border-color:var(--gold)}

  .footer{text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-faint);padding:14px 12px 20px}
  .footer button{font-family:inherit;font-size:inherit;letter-spacing:inherit;color:var(--gold-deep);background:none;border:none;cursor:pointer;text-transform:uppercase}
  .footer button:hover{color:var(--gold)}
</style>

<body>

<!-- PAGE HEADER -->
<div class="pagehead">
  <div class="row">
    <div class="brand">OMNI BRASIL</div>
    <div class="iso">ISO 9001</div>
    <button class="reset" onclick="restart()">Reiniciar</button>
  </div>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>

<div class="shell">
  <div class="protobar">Protótipo · <b>OMNI Brasil</b> · Pesquisa de qualificação SDR-IA (mockup clicável)</div>
  <div class="chat" id="chat"></div>
  <div class="dock" id="dock"></div>
  <div class="footer">
    Protótipo de alta fidelidade, não é a pesquisa final ·
    <button onclick="restart('A')">testar braço Transição</button> ·
    <button onclick="restart('B')">testar braço Terapeutas</button>
  </div>
</div>

<script>

    {label:'Outra abordagem', v:'outra'}
  ]},
  {only:'B', type:'single', key:'tempo_atende', q:'Há quanto tempo você atende?', options:[
    {label:'Menos de 1 ano', v:'<1'},
    {label:'De 1 a 3 anos', v:'1-3'},
    {label:'De 3 a 5 anos', v:'3-5'},
    {label:'Mais de 5 anos', v:'5+'}
  ]},
  {only:'B', type:'single', key:'clientes', q:'Quantos clientes você atende por semana hoje, mais ou menos?', options:[
    {label:'Nenhum ainda de forma constante', v:'0'},
    {label:'De 1 a 3', v:'1-3'},
    {label:'De 4 a 8', v:'4-8'},
    {label:'Mais de 8', v:'8+'}
  ]},
  {only:'B', type:'single', key:'trava', q:'O que mais trava o seu crescimento hoje?', options:[
    {label:'Poucos clientes', v:'clientes'},
    {label:'Preço baixo', v:'preco'},
    {label:'Falta de método', v:'metodo'},
    {label:'Divulgação e posicionamento', v:'divulgacao'},
    {label:'Segurança e autoridade', v:'autoridade'}
  ]},
  {only:'B', type:'text', key:'dor', q:'Me conta com suas palavras: o que mais te frustra hoje no seu trabalho como terapeuta?', ph:'Escreve aqui, pode ser curto...'},
  {only:'B', type:'bot', lines:[
    'A Omniterapia adiciona à sua prática um método com autoridade, a <span class="em">única com ISO 9001</span>, 46 anos de legado.',
    'É o que te dá mais resultado, mais clientes e margem pra cobrar melhor.'
  ]},

  /* ================= NÚCLEO COMUM ================= */
  {type:'bot', affirm:true, lines:['Agora só faltam alguns pontos pra fechar o seu perfil.']},
  {type:'single', key:'idade', q:'Qual a sua faixa de idade?', options:[
    {label:'18 a 24 anos', v:'18-24'},
    {label:'25 a 34 anos', v:'25-34'},
    {label:'35 a 44 anos', v:'35-44'},
    {label:'45 a 54 anos', v:'45-54'},
    {label:'55 anos ou mais', v:'55+'}
  ]},
  {type:'single', key:'escolaridade', q:'E qual a sua escolaridade?', options:[
    {label:'Ensino fundamental', v:'fund', dq:true},
    {label:'Ensino médio incompleto', v:'medio_inc', dq:true},
    {label:'Ensino médio completo', v:'medio'},
    {label:'Superior incompleto', v:'sup_inc'},
    {label:'Superior completo', v:'sup'}
  ]},
  {type:'single', key:'renda', q:'Essa é anônima e ajuda a montar o seu plano: qual a renda média da sua família por mês?', options:[
    {label:'Até R$ 3 mil', v:'ate3'},
    {label:'De R$ 3 mil a R$ 6 mil', v:'3-6'},
    {label:'De R$ 6 mil a R$ 10 mil', v:'6-10'},
    {label:'De R$ 10 mil a R$ 20 mil', v:'10-20'},
    {label:'Acima de R$ 20 mil', v:'20+'}
  ]},
  {type:'single', key:'investe', q:'Você costuma investir no seu desenvolvimento?', options:[
    {label:'Com frequência', v:'freq'},
    {label:'De vez em quando', v:'asvezes'},
    {label:'Quase nunca', v:'quase_nunca'}
  ]},
  {type:'scale', key:'comprometimento', qA:'De 0 a 10, o quanto você está disposta a fazer o que for necessário HOJE por essa mudança?', qB:'De 0 a 10, o quanto você está disposta a fazer o que for necessário HOJE por esse crescimento?'},
  {type:'text', key:'porque_agora', q:'E o que te faz querer resolver isso justo agora?', ph:'Pode escrever livremente...'},
  {type:'single', key:'decisor', q:'Última: essa decisão você toma sozinha ou alinha com alguém, cônjuge ou família?', options:[
    {label:'Tomo sozinha', v:'sozinha'},
    {label:'Alinho com alguém', v:'alinho'}
  ]}
];

/* ===== engine ===== */
var chat = document.getElementById('chat');
var dock = document.getElementById('dock');
var bar  = document.getElementById('bar');

function scrollDown(){ requestAnimationFrame(function(){ window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); }); }

function botRow(html, cls){
  var r = document.createElement('div');
  r.className = 'row bot';
  r.innerHTML = '<div class="av">'+INF+'</div><div class="bubble '+(cls||'')+'">'+html+'</div>';
  chat.appendChild(r); scrollDown();
}
function leadRow(text){
  var r = document.createElement('div');
  r.className = 'row lead';
  r.innerHTML = '<div class="bubble">'+text+'</div>';
  chat.appendChild(r); scrollDown();
}
function typing(cb, ms){
  var r = document.createElement('div');
  r.className = 'row bot';
  r.innerHTML = '<div class="av">'+INF+'</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  chat.appendChild(r); scrollDown();
  setTimeout(function(){ chat.removeChild(r); cb(); }, ms||520);
}

/* render a sequence of bot lines with typing pauses, then done() */
function botSequence(lines, cls, done){
  var idx = 0;
  (function next(){
    if(idx>=lines.length){ if(done) done(); return; }
    typing(function(){
      botRow(lines[idx], cls);
      idx++;
      setTimeout(next, 260);
    }, idx===0?480:560);
  })();
}

function setProgress(){
  var total = 12; // aproximação de passos visíveis por percurso
  var pct = Math.min(100, Math.round((state.answered||0)/total*100));
  bar.style.width = pct+'%';
}

/* find next flow index respecting branch */
function nextIndex(from){
  for(var k=from;k<FLOW.length;k++){
    var s = FLOW[k];
    if(s.only && s.only!==state.branch) continue;
    return k;
  }
  return -1;
}

function run(){
  var idx = nextIndex(state.i);
  if(idx===-1){ finish(); return; }
  state.i = idx;
  var s = FLOW[idx];
  dock.innerHTML = '';

  if(s.type==='bot'){
    botSequence(s.lines, s.affirm?'affirm':'', function(){
      if(s.cta){
        dock.innerHTML = '<button class="cta" id="ctaBtn">'+s.cta+'</button>';
        document.getElementById('ctaBtn').onclick = function(){ advance(); };
      } else {
        state.i++; run();
      }
    });
    return;
  }

  /* question steps: show question bubble, then controls */
  var qtext = s.q || (state.branch==='B'?s.qB:s.qA);
  typing(function(){
    botRow(qtext);
    renderControls(s);
  }, 480);
}

function renderControls(s){
  dock.innerHTML='';
  if(s.type==='single'){
    var wrap=document.createElement('div'); wrap.className='opts';
    s.options.forEach(function(o){
      var b=document.createElement('button'); b.className='opt'; b.textContent=o.label;
      b.onclick=function(){
        if(o.branch) state.branch=o.branch;
        if(o.dq) state.disqualify=true;
        state.answers[s.key]={v:o.v,label:o.label};
        answered(o.label);
      };
      wrap.appendChild(b);
    });
    dock.appendChild(wrap); scrollDown();
  }
  else if(s.type==='multi'){
    var box=document.createElement('div'); box.className='opts';
    var hint=document.createElement('div'); hint.className='multi-hint'; hint.textContent='Marque quantos quiser'; box.appendChild(hint);
    var chosen=[];
    s.options.forEach(function(o){
      var b=document.createElement('button'); b.className='opt check';
      b.innerHTML='<span class="box"></span><span>'+o.label+'</span>';
      b.onclick=function(){
        var i=chosen.indexOf(o.label);
        if(i>=0){chosen.splice(i,1);b.classList.remove('on');}
        else{chosen.push(o.label);b.classList.add('on');}
      };
      box.appendChild(b);
    });
    var conf=document.createElement('button'); conf.className='cta'; conf.style.marginTop='8px'; conf.textContent='Continuar';
    conf.onclick=function(){ if(!chosen.length)return; state.answers[s.key]=chosen.join(', '); answered(chosen.join(', ')); };
    box.appendChild(conf); dock.appendChild(box); scrollDown();
  }
  else if(s.type==='scale'){
    var g=document.createElement('div'); g.className='scale';
    for(var n=0;n<=10;n++){(function(n){
      var c=document.createElement('button'); c.className='chip'; c.textContent=n;
      c.onclick=function(){ state.answers[s.key]={v:n,label:n+' de 10'}; answered(n+' de 10'); };
      g.appendChild(c);
    })(n);}
    var leg=document.createElement('div'); leg.className='scale-legend';
    leg.innerHTML='<span>0 · nada</span><span>10 · com tudo</span>';
    dock.appendChild(g); dock.appendChild(leg); scrollDown();
  }
  else if(s.type==='text'){
    var d=document.createElement('div'); d.className='tinput';
    var ta=document.createElement('textarea'); ta.rows=1; ta.placeholder=s.ph||'Escreva aqui...';
    ta.oninput=function(){ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; };
    var snd=document.createElement('button'); snd.className='send'; snd.textContent='Enviar';
    function submit(){ var v=ta.value.trim(); if(!v)return; state.answers[s.key]=v; answered(v); }
    snd.onclick=submit;
    ta.onkeydown=function(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit();} };
    d.appendChild(ta); d.appendChild(snd); dock.appendChild(d);
    var skip=document.createElement('button'); skip.className='skip'; skip.textContent='prefiro não responder';
    skip.onclick=function(){ state.answers[s.key]='(não respondeu)'; answered('Prefiro não responder'); };
    dock.appendChild(skip);
    setTimeout(function(){ta.focus();},100); scrollDown();
  }
}

function answered(labelForBubble){
  leadRow(labelForBubble);
  state.answered=(state.answered||0)+1;
  setProgress();
  dock.innerHTML='';
  state.i++;
  setTimeout(run, 360);
}

function advance(){ state.i++; setProgress(); run(); }

/* ===== DESFECHO: espelho + agenda OU rota alternativa ===== */
function finish(){
  dock.innerHTML='';
  var a=state.answers;
  var comp = a.comprometimento ? a.comprometimento.v : 10;
  var dor = a.dor && a.dor!=='(não respondeu)' ? a.dor : null;
  var qualified = !state.disqualify && comp>=7;

  var mirror;
  if(state.branch==='B'){
    mirror = [
      'Deixa eu te devolver o que ouvi.',
      'Você já atende e ajuda pessoas, mas <span class="em">'+ (a.trava?a.trava.label.toLowerCase():'algumas coisas') +'</span> está segurando o seu crescimento'+ (dor?', e o que mais te frustra é isso que você me contou.':'.'),
      'Na consultoria, o consultor vai desenhar com você como usar o método OMNI, com autoridade de <span class="em">ISO 9001 e 46 anos</span>, pra você ter mais clientes, mais resultado e cobrar o que o seu trabalho vale.'
    ];
  } else {
    mirror = [
      'Deixa eu te devolver o que ouvi.',
      'Você sente essa vontade de mudar'+ (a.tempo_vontade&&a.tempo_vontade.v!=='agora'?' já faz um tempo':'') +', mas <span class="em">'+ (a.impede?a.impede.label.toLowerCase():'algumas coisas') +'</span> te trava'+ (dor?', e é isso que você me descreveu.':'.'),
      'Na consultoria, o consultor vai desenhar com você um caminho pra construir a Omniterapia <span class="em">em paralelo, sem abrir mão da sua segurança</span>, e dar o primeiro passo com clareza.'
    ];
  }

  botSequence(mirror, '', function(){
    if(qualified) showAgenda();
    else showAlt();
  });
}

function showAgenda(){
  typing(function(){
    botRow('Pelo que você me contou, o seu perfil faz <span class="em">muito sentido</span> pra essa consultoria estratégica.<br><br>Escolhe o melhor horário pra gente conversar:');
    var slots=[
      {m:'Hoje', d:'HJ', day:'Hoje', time:'15h00 · 40 min com o consultor'},
      {m:'Amanhã', d:'AM', day:'Amanhã de manhã', time:'09h00 · 40 min com o consultor'},
      {m:'Amanhã', d:'AM', day:'Amanhã à tarde', time:'16h30 · 40 min com o consultor'}
    ];
    var wrap=document.createElement('div'); wrap.className='agenda';
    slots.forEach(function(s){
      var el=document.createElement('button'); el.className='slot';
      el.innerHTML='<div class="cal"><div class="m">'+s.m+'</div><div class="d">'+s.d+'</div></div>'+
                   '<div class="info"><div class="day">'+s.day+'</div><div class="time">'+s.time+'</div></div>'+
                   '<div class="arr">&rsaquo;</div>';
      el.onclick=function(){ commit(s.day, s.time.split(' ')[0]); };
      wrap.appendChild(el);
    });
    var note=document.createElement('div'); note.className='agenda-note'; note.textContent='horários ilustrativos · integra com Cal.com no fluxo real';
    dock.innerHTML=''; dock.appendChild(wrap); dock.appendChild(note); scrollDown();
  },520);
}

function commit(day, time){
  leadRow(day+', '+time);
  dock.innerHTML='';
  typing(function(){
    botRow('Perfeito, <span class="em">'+day.toLowerCase()+' às '+time+'</span> está reservado pra você.<br><br>Posso contar que você vai estar lá, de verdade?');
    var b=document.createElement('button'); b.className='cta'; b.textContent='Confirmo, vou estar lá';
    b.onclick=function(){ leadRow('Confirmo, vou estar lá'); dock.innerHTML=''; endOk(day,time); };
    dock.innerHTML=''; dock.appendChild(b); scrollDown();
  },520);
}

function endOk(day,time){
  typing(function(){
    var el=document.createElement('div'); el.className='final';
    el.innerHTML =
      '<span class="inf" style="width:64px">'+INF+'</span>'+
      '<div class="banner ok" style="text-align:left"><div class="tag">Consultoria confirmada</div>'+
      '<h4>'+day+', '+time+'</h4>'+
      '<p>A partir daqui, a nossa assistente cuida de tudo: você recebe a confirmação no WhatsApp e os lembretes até a hora da conversa. É só aparecer.</p></div>'+
      '<h3 style="margin-top:22px">O primeiro passo do seu novo caminho já está marcado.</h3>'+
      '<p>A OMNI forma profissionais que ajudam pessoas. Nessa conversa a gente vê, juntos, se esse caminho é pra você.</p>'+
      '<button class="restart" onclick="restart()">Reiniciar protótipo</button>';
    chat.appendChild(el); setProgress(true); bar.style.width='100%'; scrollDown();
  },560);
}

function showAlt(){
  typing(function(){
    var el=document.createElement('div'); el.className='final';
    el.innerHTML =
      '<div class="banner alt" style="text-align:left"><div class="tag">Um caminho pra você começar</div>'+
      '<h4>Esse talvez não seja o melhor momento pra consultoria</h4>'+
      '<p>Pelo que você me contou, faz mais sentido você conhecer a Omniterapia com calma antes de uma consultoria estratégica. E tem um jeito bom de começar isso agora, no seu tempo.</p></div>'+
      '<div style="margin-top:14px;text-align:left">'+
        '<button class="opt" style="width:100%" onclick="restart()">Quero receber um conteúdo gratuito pra entender melhor</button>'+
      '</div>'+
      '<p style="margin-top:18px">Quando fizer sentido, a porta da OMNI continua aberta pra você.</p>'+
      '<button class="restart" onclick="restart()">Reiniciar protótipo</button>';
    chat.appendChild(el); bar.style.width='100%'; scrollDown();
  },560);
}

/* ===== restart ===== */
function restart(forceBranch){
  state={branch:null, disqualify:false, answers:{}, i:0, answered:0};
  chat.innerHTML=''; dock.innerHTML=''; bar.style.width='0';
  window.scrollTo({top:0});
  if(forceBranch){
    // pré-seleciona segmento pra testar o braço direto
    state.branch=forceBranch;
    state.answers.segmento={v:forceBranch==='B'?'atendo':'mudar',label:forceBranch==='B'?'Já atendo e quero crescer, me especializar':'Quero mudar de carreira'};
    botSequence(FLOW[0].lines, '', function(){
      botRow(FLOW[1].q); // pergunta de segmentação
      leadRow(state.answers.segmento.label);
      state.i=2; // pula segmentação já respondida
      setTimeout(run,400);
    });
  } else {
    run();
  }
}

/* ===== inicia direto, sem senha ===== */
run();
</script>
